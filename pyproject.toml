[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collibra-governance-automation"
version = "0.1.0"
description = "Technical metadata governance tooling with Python and PostgreSQL, using a vendor-neutral model and explicit boundaries for Collibra integration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "fgnfmackk" }]
dependencies = [
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
governance = "governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires the local PostgreSQL demo service",
    "collibra_integration: Collibra mock lifecycle against local PostgreSQL demo",
    "cli_integration: end-to-end CLI smoke against local PostgreSQL demo",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
