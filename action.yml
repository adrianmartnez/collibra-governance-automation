name: Governance as Code
description: >
  Run read-only Governance-as-Code validation, policy checks, change planning,
  impact analysis, and authority/conflict/drift review with deterministic Action
  outputs, Markdown summaries, and optional sticky PR comments.
author: adrianmartnez

branding:
  icon: check-circle
  color: blue

inputs:
  config:
    description: >
      Workspace-relative path to governance.yaml.
      Required for validate/check/plan (enforced in Phase A).
      Optional for impact (validates config/authority and enables policy matching).
      Optional for review (authority for the conflict lane; requires review-observations).
    required: false
    default: ""
  profile:
    description: Optional governance.yaml profile name
    required: false
    default: ""
  operation:
    description: Action operation (validate, check, plan, impact, or review)
    required: false
    default: plan
  output-format:
    description: Console surface only (human or json); does not alter artifacts
    required: false
    default: human
  fail-on-policy-error:
    description: When true, final gate exits 3 on policy blocked
    required: false
    default: "true"
  fail-on-review-blocked:
    description: When true, final gate exits 3 on review blocked
    required: false
    default: "true"
  output-directory:
    description: Workspace-relative artifact root
    required: false
    default: .governance
  plan-path:
    description: Workspace-relative plan path; must be under output-directory
    required: false
    default: .governance/governance.gplan
  pr-comment:
    description: Opt-in sticky pull request comment
    required: false
    default: "false"
  github-token:
    description: Token for sticky comment step only
    required: false
    default: ""
  impact-namespace:
    description: Shared logical namespace for impact analysis (required for operation=impact)
    required: false
    default: ""
  impact-changes:
    description: Workspace-relative governance-impact-changes v1 path (required for operation=impact)
    required: false
    default: ""
  impact-odcs:
    description: JSON array of workspace-relative ODCS paths (e.g. ["contracts/a.yaml"])
    required: false
    default: ""
  impact-dbt-manifest:
    description: JSON array of workspace-relative dbt manifest paths
    required: false
    default: ""
  impact-openlineage:
    description: JSON array of workspace-relative OpenLineage event paths
    required: false
    default: ""
  dbt-default-database:
    description: Optional default database forwarded to dbt manifest loading
    required: false
    default: ""
  review-observations:
    description: >
      Workspace-relative governance-property-observations path.
      Enables the conflict lane for operation=review.
    required: false
    default: ""
  review-comparison:
    description: >
      Workspace-relative governance-comparison-result path for review drift lane mode A.
      Mutually exclusive with review baseline/candidate snapshots.
    required: false
    default: ""
  review-baseline-snapshot:
    description: Workspace-relative baseline snapshot for review drift lane mode B
    required: false
    default: ""
  review-candidate-snapshot:
    description: Workspace-relative candidate snapshot for review drift lane mode B
    required: false
    default: ""
  review-drift-policy:
    description: Optional workspace-relative drift policy (only when drift lane is enabled)
    required: false
    default: ""
  review-align-source-roots:
    description: Align source roots when building comparison from baseline/candidate snapshots
    required: false
    default: "false"
  review-align-database-roots:
    description: Align database roots when building comparison from baseline/candidate snapshots
    required: false
    default: "false"

outputs:
  contract-version:
    description: governance-action-result contract version; empty for impact and review
    value: ${{ steps.final.outputs.contract-version }}
  status:
    description: Overall governance status
    value: ${{ steps.final.outputs.status }}
  validation-status:
    description: Governance config validation status
    value: ${{ steps.final.outputs.validation-status }}
  policy-status:
    description: Policy evaluation status
    value: ${{ steps.final.outputs.policy-status }}
  policy-violation-count:
    description: Total policy violations
    value: ${{ steps.final.outputs.policy-violation-count }}
  policy-error-count:
    description: Policy error violations
    value: ${{ steps.final.outputs.policy-error-count }}
  policy-warning-count:
    description: Policy warning violations
    value: ${{ steps.final.outputs.policy-warning-count }}
  plan-status:
    description: Plan stage status
    value: ${{ steps.final.outputs.plan-status }}
  create-count:
    description: CREATE action count
    value: ${{ steps.final.outputs.create-count }}
  update-count:
    description: UPDATE action count
    value: ${{ steps.final.outputs.update-count }}
  unchanged-count:
    description: UNCHANGED action count
    value: ${{ steps.final.outputs.unchanged-count }}
  remote-only-count:
    description: REMOTE_ONLY action count
    value: ${{ steps.final.outputs.remote-only-count }}
  writes-performed:
    description: Remote writes performed (always 0)
    value: ${{ steps.final.outputs.writes-performed }}
  plan-path:
    description: Relative path to generated plan, or empty
    value: ${{ steps.final.outputs.plan-path }}
  result-path:
    description: Relative path to action-result.json, or empty on Phase A failure / impact / review
    value: ${{ steps.final.outputs.result-path }}
  report-path:
    description: Relative path to report.md, or empty on Phase A failure
    value: ${{ steps.final.outputs.report-path }}
  artifacts-path:
    description: Relative output-directory root, or empty on Phase A failure
    value: ${{ steps.final.outputs.artifacts-path }}
  comment-status:
    description: Sticky comment delivery status
    value: ${{ steps.final.outputs.comment-status }}
  impact-status:
    description: Impact analysis status (not_run, clear, impacted, or failed)
    value: ${{ steps.final.outputs.impact-status }}
  impact-result-path:
    description: Relative path to impact-result.json, or empty
    value: ${{ steps.final.outputs.impact-result-path }}
  impact-result-version:
    description: governance-impact-result contract version; empty when not recognized / not run
    value: ${{ steps.final.outputs.impact-result-version }}
  review-status:
    description: Review status (not_run, passed, blocked, or failed)
    value: ${{ steps.final.outputs.review-status }}
  review-result-path:
    description: Relative path to review-result.json, or empty
    value: ${{ steps.final.outputs.review-result-path }}
  review-result-version:
    description: governance-ci-review-result contract version; empty when not recognized / not run
    value: ${{ steps.final.outputs.review-result-version }}
  conflict-status:
    description: Conflict lane status (not_run, clear, findings, or blocked)
    value: ${{ steps.final.outputs.conflict-status }}
  conflict-property-count:
    description: Properties analyzed in the conflict lane
    value: ${{ steps.final.outputs.conflict-property-count }}
  unresolved-conflict-count:
    description: Unresolved conflict count
    value: ${{ steps.final.outputs.unresolved-conflict-count }}
  resolved-authority-count:
    description: Conflicts resolved by authority
    value: ${{ steps.final.outputs.resolved-authority-count }}
  reconciliation-blocked-count:
    description: Reconciliation-blocked assessment count
    value: ${{ steps.final.outputs.reconciliation-blocked-count }}
  drift-status:
    description: Drift lane status (not_run, no_difference, expected_difference, or unexpected_drift)
    value: ${{ steps.final.outputs.drift-status }}
  expected-difference-count:
    description: Expected difference count from drift analysis
    value: ${{ steps.final.outputs.expected-difference-count }}
  unexpected-drift-count:
    description: Unexpected drift count
    value: ${{ steps.final.outputs.unexpected-drift-count }}
  drift-affected-object-count:
    description: Objects affected by drift
    value: ${{ steps.final.outputs.drift-affected-object-count }}
  comparison-result-path:
    description: Relative path to comparison-result.json, or empty
    value: ${{ steps.final.outputs.comparison-result-path }}
  drift-result-path:
    description: Relative path to drift-result.json, or empty
    value: ${{ steps.final.outputs.drift-result-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Bootstrap Action venv
      id: bootstrap
      shell: bash
      run: |
        set -euo pipefail
        ACTION_VENV="$(mktemp -d "${RUNNER_TEMP}/gac-action-venv.XXXXXX")"
        python -m venv "${ACTION_VENV}"
        "${ACTION_VENV}/bin/python" -m pip install --upgrade pip
        "${ACTION_VENV}/bin/python" -m pip install "${{ github.action_path }}"
        echo "action-python=${ACTION_VENV}/bin/python" >> "${GITHUB_OUTPUT}"

    - name: Run governance orchestration
      id: governance-run
      shell: bash
      env:
        # Intentionally omit github-token / GITHUB_TOKEN / GH_TOKEN / INPUT_GITHUB_TOKEN.
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GOV_ACTION_CONFIG: ${{ inputs.config }}
        GOV_ACTION_PROFILE: ${{ inputs.profile }}
        GOV_ACTION_OPERATION: ${{ inputs.operation }}
        GOV_ACTION_OUTPUT_FORMAT: ${{ inputs.output-format }}
        GOV_ACTION_FAIL_ON_POLICY_ERROR: ${{ inputs.fail-on-policy-error }}
        GOV_ACTION_FAIL_ON_REVIEW_BLOCKED: ${{ inputs.fail-on-review-blocked }}
        GOV_ACTION_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        GOV_ACTION_PLAN_PATH: ${{ inputs.plan-path }}
        GOV_ACTION_PR_COMMENT: ${{ inputs.pr-comment }}
        GOV_ACTION_IMPACT_NAMESPACE: ${{ inputs.impact-namespace }}
        GOV_ACTION_IMPACT_CHANGES: ${{ inputs.impact-changes }}
        GOV_ACTION_IMPACT_ODCS: ${{ inputs.impact-odcs }}
        GOV_ACTION_IMPACT_DBT_MANIFEST: ${{ inputs.impact-dbt-manifest }}
        GOV_ACTION_IMPACT_OPENLINEAGE: ${{ inputs.impact-openlineage }}
        GOV_ACTION_DBT_DEFAULT_DATABASE: ${{ inputs.dbt-default-database }}
        GOV_ACTION_REVIEW_OBSERVATIONS: ${{ inputs.review-observations }}
        GOV_ACTION_REVIEW_COMPARISON: ${{ inputs.review-comparison }}
        GOV_ACTION_REVIEW_BASELINE_SNAPSHOT: ${{ inputs.review-baseline-snapshot }}
        GOV_ACTION_REVIEW_CANDIDATE_SNAPSHOT: ${{ inputs.review-candidate-snapshot }}
        GOV_ACTION_REVIEW_DRIFT_POLICY: ${{ inputs.review-drift-policy }}
        GOV_ACTION_REVIEW_ALIGN_SOURCE_ROOTS: ${{ inputs.review-align-source-roots }}
        GOV_ACTION_REVIEW_ALIGN_DATABASE_ROOTS: ${{ inputs.review-align-database-roots }}
      run: |
        set -euo pipefail
        "${{ steps.bootstrap.outputs.action-python }}" -I -m governance.github_ci run \
          --config "$GOV_ACTION_CONFIG" \
          --profile "$GOV_ACTION_PROFILE" \
          --operation "$GOV_ACTION_OPERATION" \
          --output-format "$GOV_ACTION_OUTPUT_FORMAT" \
          --fail-on-policy-error "$GOV_ACTION_FAIL_ON_POLICY_ERROR" \
          --fail-on-review-blocked "$GOV_ACTION_FAIL_ON_REVIEW_BLOCKED" \
          --output-directory "$GOV_ACTION_OUTPUT_DIRECTORY" \
          --plan-path "$GOV_ACTION_PLAN_PATH" \
          --pr-comment "$GOV_ACTION_PR_COMMENT" \
          --impact-namespace "$GOV_ACTION_IMPACT_NAMESPACE" \
          --impact-changes "$GOV_ACTION_IMPACT_CHANGES" \
          --impact-odcs "$GOV_ACTION_IMPACT_ODCS" \
          --impact-dbt-manifest "$GOV_ACTION_IMPACT_DBT_MANIFEST" \
          --impact-openlineage "$GOV_ACTION_IMPACT_OPENLINEAGE" \
          --dbt-default-database "$GOV_ACTION_DBT_DEFAULT_DATABASE" \
          --review-observations "$GOV_ACTION_REVIEW_OBSERVATIONS" \
          --review-comparison "$GOV_ACTION_REVIEW_COMPARISON" \
          --review-baseline-snapshot "$GOV_ACTION_REVIEW_BASELINE_SNAPSHOT" \
          --review-candidate-snapshot "$GOV_ACTION_REVIEW_CANDIDATE_SNAPSHOT" \
          --review-drift-policy "$GOV_ACTION_REVIEW_DRIFT_POLICY" \
          --review-align-source-roots "$GOV_ACTION_REVIEW_ALIGN_SOURCE_ROOTS" \
          --review-align-database-roots "$GOV_ACTION_REVIEW_ALIGN_DATABASE_ROOTS"

    - name: Emit annotations and comment state
      id: comment-state
      if: ${{ !cancelled() }}
      shell: bash
      env:
        PHASE_A_FAILED: ${{ steps.governance-run.outputs.phase-a-failed }}
        ANNOTATIONS_PATH: ${{ steps.governance-run.outputs.annotations-path }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_TOKEN_NONEMPTY: ${{ inputs.github-token != '' }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        "${{ steps.bootstrap.outputs.action-python }}" -I -m governance.github_ci emit-annotations-and-comment-state

    - name: Publish sticky PR comment
      id: governance-comment
      if: ${{ !cancelled() && steps.comment-state.outputs.comment-eligibility == 'requested' && inputs.github-token != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMENT_ELIGIBILITY: ${{ steps.comment-state.outputs.comment-eligibility }}
        REPORT_PATH: ${{ steps.governance-run.outputs.report-path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        "${{ steps.bootstrap.outputs.action-python }}" -I -m governance.github_ci comment

    - name: Finalize Action outputs
      id: final
      if: ${{ !cancelled() }}
      shell: bash
      env:
        PHASE_A_FAILED: ${{ steps.governance-run.outputs.phase-a-failed }}
        DESIRED_EXIT_CODE: ${{ steps.governance-run.outputs.desired-exit-code }}
        COMMENT_STATUS_STATE: ${{ steps.comment-state.outputs.comment-status }}
        COMMENT_ELIGIBILITY: ${{ steps.comment-state.outputs.comment-eligibility }}
        COMMENT_STATUS_PUBLISHER: ${{ steps.governance-comment.outputs.comment-status }}
        FAIL_ON_POLICY_ERROR: ${{ inputs.fail-on-policy-error }}
        GOV_CONTRACT_VERSION: ${{ steps.governance-run.outputs.contract-version }}
        GOV_STATUS: ${{ steps.governance-run.outputs.status }}
        GOV_VALIDATION_STATUS: ${{ steps.governance-run.outputs.validation-status }}
        GOV_POLICY_STATUS: ${{ steps.governance-run.outputs.policy-status }}
        GOV_POLICY_VIOLATION_COUNT: ${{ steps.governance-run.outputs.policy-violation-count }}
        GOV_POLICY_ERROR_COUNT: ${{ steps.governance-run.outputs.policy-error-count }}
        GOV_POLICY_WARNING_COUNT: ${{ steps.governance-run.outputs.policy-warning-count }}
        GOV_PLAN_STATUS: ${{ steps.governance-run.outputs.plan-status }}
        GOV_CREATE_COUNT: ${{ steps.governance-run.outputs.create-count }}
        GOV_UPDATE_COUNT: ${{ steps.governance-run.outputs.update-count }}
        GOV_UNCHANGED_COUNT: ${{ steps.governance-run.outputs.unchanged-count }}
        GOV_REMOTE_ONLY_COUNT: ${{ steps.governance-run.outputs.remote-only-count }}
        GOV_WRITES_PERFORMED: ${{ steps.governance-run.outputs.writes-performed }}
        GOV_PLAN_PATH: ${{ steps.governance-run.outputs.plan-path }}
        GOV_RESULT_PATH: ${{ steps.governance-run.outputs.result-path }}
        GOV_REPORT_PATH: ${{ steps.governance-run.outputs.report-path }}
        GOV_ARTIFACTS_PATH: ${{ steps.governance-run.outputs.artifacts-path }}
        GOV_IMPACT_STATUS: ${{ steps.governance-run.outputs.impact-status }}
        GOV_IMPACT_RESULT_PATH: ${{ steps.governance-run.outputs.impact-result-path }}
        GOV_IMPACT_RESULT_VERSION: ${{ steps.governance-run.outputs.impact-result-version }}
        GOV_REVIEW_STATUS: ${{ steps.governance-run.outputs.review-status }}
        GOV_REVIEW_RESULT_PATH: ${{ steps.governance-run.outputs.review-result-path }}
        GOV_REVIEW_RESULT_VERSION: ${{ steps.governance-run.outputs.review-result-version }}
        GOV_CONFLICT_STATUS: ${{ steps.governance-run.outputs.conflict-status }}
        GOV_CONFLICT_PROPERTY_COUNT: ${{ steps.governance-run.outputs.conflict-property-count }}
        GOV_UNRESOLVED_CONFLICT_COUNT: ${{ steps.governance-run.outputs.unresolved-conflict-count }}
        GOV_RESOLVED_AUTHORITY_COUNT: ${{ steps.governance-run.outputs.resolved-authority-count }}
        GOV_RECONCILIATION_BLOCKED_COUNT: ${{ steps.governance-run.outputs.reconciliation-blocked-count }}
        GOV_DRIFT_STATUS: ${{ steps.governance-run.outputs.drift-status }}
        GOV_EXPECTED_DIFFERENCE_COUNT: ${{ steps.governance-run.outputs.expected-difference-count }}
        GOV_UNEXPECTED_DRIFT_COUNT: ${{ steps.governance-run.outputs.unexpected-drift-count }}
        GOV_DRIFT_AFFECTED_OBJECT_COUNT: ${{ steps.governance-run.outputs.drift-affected-object-count }}
        GOV_COMPARISON_RESULT_PATH: ${{ steps.governance-run.outputs.comparison-result-path }}
        GOV_DRIFT_RESULT_PATH: ${{ steps.governance-run.outputs.drift-result-path }}
      run: |
        set -euo pipefail
        "${{ steps.bootstrap.outputs.action-python }}" -I -m governance.github_ci finalize

    - name: Final failure gate
      if: ${{ !cancelled() }}
      shell: bash
      env:
        FINAL_EXIT_CODE: ${{ steps.final.outputs.final-exit-code }}
      run: |
        set +e
        "${{ steps.bootstrap.outputs.action-python }}" -I -m governance.github_ci fail-gate
        exit $?
