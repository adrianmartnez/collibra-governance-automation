name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Import package
        run: python -c "import governance; print(governance.__version__)"

      - name: Entry point
        run: python -m governance

      - name: Pytest
        run: pytest -m "not integration"

  package-validation:
    name: package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Install artifact in clean environment
        run: |
          python -m venv .venv-package
          . .venv-package/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import governance; print(governance.__version__)"
          python -c "from governance.scanner import MetadataDiscoveryError, PostgresMetadataScanner"
          python -c "from governance.exporters import INVENTORY_SCHEMA, INVENTORY_VERSION, SCANNER_CONTRACT_VERSION, InventoryExportError, MetadataInventory, write_inventory"
          python -c "from governance.integrations.collibra import CollibraAdapterError, CollibraDesiredState, CollibraRemoteState, LiveCollibraAdapter, MockCollibraAdapter, build_collibra_adapter, map_to_desired_state, mock_mapping_config"
          python -m governance

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Verify demo dataset contract
        run: bash sample/verify_demo.sh

      - name: Recreate from clean volume
        run: |
          docker compose down -v
          docker compose up -d --wait
          bash sample/verify_demo.sh

      - name: Teardown
        if: always()
        run: docker compose down -v

  metadata-integration:
    name: metadata-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Metadata integration tests
        run: pytest -m integration

      - name: Teardown
        if: always()
        run: docker compose down -v
