name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Import package
        run: python -c "import governance; print(governance.__version__)"

      - name: Entry point
        run: |
          governance --help
          python -m governance --help

      - name: Pytest
        run: pytest -m "not integration and not collibra_integration and not cli_integration and not collibra_contract"

  collibra-contract:
    name: collibra-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Collibra contract tests
        run: pytest -m collibra_contract

  package-validation:
    name: package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Install artifact in clean environment
        run: |
          python -m venv .venv-package
          . .venv-package/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import governance; from importlib import metadata; assert governance.__version__ == '1.3.0'; assert metadata.version('collibra-governance-automation') == '1.3.0'"
          python -c "from governance.scanner import MetadataDiscoveryError, PostgresMetadataScanner"
          python -c "from governance.exporters import INVENTORY_SCHEMA, INVENTORY_VERSION, SCANNER_CONTRACT_VERSION, InventoryExportError, MetadataInventory, write_inventory"
          python -c "from governance.integrations.collibra import CollibraAdapterError, CollibraDesiredState, CollibraRemoteState, LiveCollibraAdapter, MockCollibraAdapter, SyncPlan, SyncResult, build_collibra_adapter, build_sync_plan, execute_sync_plan, load_mapping_config_file, map_to_desired_state, mapping_contains_example_placeholders, mock_mapping_config"
          python -c "from importlib.resources import files; c=files('governance.config_contract.schemas').joinpath('governance-config.v1.schema.json'); p=files('governance.policy.schemas').joinpath('governance-policy.v1.schema.json'); g=files('governance.plans.schemas').joinpath('governance-plan.v1.schema.json'); a=files('governance.github_ci.schemas').joinpath('governance-action-result.v1.schema.json'); cmp=files('governance.comparison.schemas').joinpath('governance-snapshot-comparison.v1.schema.json'); cdiag=files('governance.comparison.schemas').joinpath('governance-comparison-diagnostics.v1.schema.json'); dr=files('governance.drift.schemas').joinpath('governance-drift-result.v1.schema.json'); ddiag=files('governance.drift.schemas').joinpath('governance-drift-diagnostics.v1.schema.json'); dp=files('governance.drift.schemas').joinpath('governance-drift-policy.v1.schema.json'); hist=files('governance.history.schemas').joinpath('governance-history.v1.schema.json'); hdiag=files('governance.history.schemas').joinpath('governance-history-diagnostics.v1.schema.json'); hevo=files('governance.history.schemas').joinpath('governance-history-evolution.v1.schema.json'); obs=files('governance.observations.schemas').joinpath('governance-property-observations.v1.schema.json'); snap=files('governance.snapshots.schemas').joinpath('governance-snapshot.v1.schema.json'); ct=c.read_text(encoding='utf-8'); pt=p.read_text(encoding='utf-8'); gt=g.read_text(encoding='utf-8'); at=a.read_text(encoding='utf-8'); cmpt=cmp.read_text(encoding='utf-8'); cdiagt=cdiag.read_text(encoding='utf-8'); drt=dr.read_text(encoding='utf-8'); ddiagt=ddiag.read_text(encoding='utf-8'); dpt=dp.read_text(encoding='utf-8'); histt=hist.read_text(encoding='utf-8'); hdiagt=hdiag.read_text(encoding='utf-8'); hevot=hevo.read_text(encoding='utf-8'); obst=obs.read_text(encoding='utf-8'); snapt=snap.read_text(encoding='utf-8'); assert c.is_file() and p.is_file() and g.is_file() and a.is_file() and cmp.is_file() and cdiag.is_file() and dr.is_file() and ddiag.is_file() and dp.is_file() and hist.is_file() and hdiag.is_file() and hevo.is_file() and obs.is_file() and snap.is_file(); assert 'urn:collibra-governance-automation:schema:governance-config:1' in ct; assert 'urn:collibra-governance-automation:schema:governance-policy:1' in pt; assert 'urn:collibra-governance-automation:schema:governance-plan:1' in gt; assert 'urn:collibra-governance-automation:schema:governance-action-result:1' in at; assert 'urn:collibra-governance-automation:schema:governance-snapshot-comparison:1' in cmpt; assert 'urn:collibra-governance-automation:schema:governance-comparison-diagnostics:1' in cdiagt; assert 'urn:collibra-governance-automation:schema:governance-drift-result:1' in drt; assert 'urn:collibra-governance-automation:schema:governance-drift-diagnostics:1' in ddiagt; assert 'urn:collibra-governance-automation:schema:governance-drift-policy:1' in dpt; assert 'urn:collibra-governance-automation:schema:governance-history:1' in histt; assert 'urn:collibra-governance-automation:schema:governance-history-diagnostics:1' in hdiagt; assert 'urn:collibra-governance-automation:schema:governance-history-evolution:1' in hevot; assert 'urn:collibra-governance-automation:schema:governance-property-observations:1' in obst; assert 'urn:collibra-governance-automation:schema:governance-snapshot:1' in snapt; assert 'schema_version' in ct; assert 'policy_version' in pt; assert 'plan_version' in gt; assert 'result_version' in at; assert 'comparison_version' in cmpt; assert 'diagnostic_version' in cdiagt; assert 'drift_version' in drt; assert 'diagnostic_version' in ddiagt; assert 'drift_version' in dpt; assert 'history_version' in histt; assert 'diagnostic_version' in hdiagt; assert 'evolution_version' in hevot; assert 'observation_version' in obst; assert 'snapshot_version' in snapt"
          python -c "import json, re; from importlib.resources import files; histt=files('governance.history.schemas').joinpath('governance-history.v1.schema.json').read_text(encoding='utf-8'); assert '(?i)' not in histt; schema=json.loads(histt); pattern=schema['$'+'defs']['labels']['propertyNames']['pattern']; rx=re.compile(pattern); assert rx.fullmatch('token') is None; assert rx.fullmatch('TOKEN') is None; assert rx.fullmatch('CLIENT_SECRET') is None; assert rx.fullmatch('environment') is not None"
          python -c "from governance.policy import load_normalized_policies, evaluate_policies; from governance.plans import load_saved_plan, SavedGovernancePlan; from governance.integrations.collibra import PLANNER_CONTRACT_VERSION, normalize_base_url"
          governance --help | grep -q history
          governance --help
          test "$(governance --version)" = "governance 1.3.0"
          python -m governance --help
          ls dist/*-1.3.0-*.whl dist/*-1.3.0.tar.gz

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Verify demo dataset contract
        run: bash sample/verify_demo.sh

      - name: Recreate from clean volume
        run: |
          docker compose down -v
          docker compose up -d --wait
          bash sample/verify_demo.sh

      - name: Teardown
        if: always()
        run: docker compose down -v

  metadata-integration:
    name: metadata-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Metadata integration tests
        run: pytest -m integration

      - name: Teardown
        if: always()
        run: docker compose down -v

  collibra-integration:
    name: collibra-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Collibra mock lifecycle
        run: pytest -m collibra_integration

      - name: Teardown
        if: always()
        run: docker compose down -v

  cli-integration:
    name: cli-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: CLI integration tests
        run: pytest -m cli_integration

      - name: Official Action smoke
        id: gac-action
        uses: ./
        with:
          config: sample/governance.example.yaml
          operation: plan
          pr-comment: "false"
          output-directory: .governance-ci-action
          plan-path: .governance-ci-action/governance.gplan
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/governance_demo
          COLLIBRA_MODE: mock

      - name: Assert Action outputs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test "${{ steps.gac-action.outputs.status }}" = "passed"
          test "${{ steps.gac-action.outputs.validation-status }}" = "passed"
          test "${{ steps.gac-action.outputs.policy-status }}" = "passed"
          test "${{ steps.gac-action.outputs.plan-status }}" = "generated"
          test "${{ steps.gac-action.outputs.writes-performed }}" = "0"
          test "${{ steps.gac-action.outputs.comment-status }}" = "disabled"
          test -f "${{ steps.gac-action.outputs.plan-path }}"
          test -f "${{ steps.gac-action.outputs.result-path }}"
          test -f "${{ steps.gac-action.outputs.report-path }}"
          case "${{ steps.gac-action.outputs.plan-path }}" in
            "${{ steps.gac-action.outputs.artifacts-path }}"/*) ;;
            *) echo "plan-path not under artifacts-path"; exit 1 ;;
          esac
          python -c "import json; p=json.load(open('${{ steps.gac-action.outputs.result-path }}',encoding='utf-8')); assert p['result_schema']=='governance-action-result'; assert p['result_version']=='1'; assert p['execution']['writes_performed']==0; assert 'reporting_failure' not in str(p.get('failure_code'))"

      - name: Official Action blocked smoke
        id: gac-action-blocked
        continue-on-error: true
        uses: ./
        with:
          config: tests/fixtures/github_action/governance.blocked.yaml
          operation: check
          fail-on-policy-error: "true"
          pr-comment: "false"
          output-directory: .governance-ci-blocked
          plan-path: .governance-ci-blocked/governance.gplan
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/governance_demo
          COLLIBRA_MODE: mock

      - name: Assert blocked Action finalization
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test "${{ steps.gac-action-blocked.outcome }}" = "failure"
          test "${{ steps.gac-action-blocked.outputs.status }}" = "blocked"
          test "${{ steps.gac-action-blocked.outputs.policy-status }}" = "blocked"
          test "${{ steps.gac-action-blocked.outputs.writes-performed }}" = "0"
          test "${{ steps.gac-action-blocked.outputs.comment-status }}" = "disabled"
          test -n "${{ steps.gac-action-blocked.outputs.result-path }}"
          test -n "${{ steps.gac-action-blocked.outputs.report-path }}"
          test -n "${{ steps.gac-action-blocked.outputs.artifacts-path }}"
          test -f "${{ steps.gac-action-blocked.outputs.result-path }}"
          test -f "${{ steps.gac-action-blocked.outputs.report-path }}"
          python -c "import json; p=json.load(open('${{ steps.gac-action-blocked.outputs.result-path }}',encoding='utf-8')); assert p['status']=='blocked'; assert p['failure_code']=='policy_blocked'; assert p['execution']['writes_performed']==0"

      - name: Official Action impact CLEAR smoke
        id: gac-action-impact-clear
        uses: ./
        with:
          operation: impact
          pr-comment: "false"
          output-directory: .governance-ci-impact-clear
          impact-namespace: analytics
          impact-changes: tests/fixtures/github_action/impact/changes.json
          impact-dbt-manifest: '["tests/fixtures/github_action/impact/manifest.clear.json"]'

      - name: Assert impact CLEAR Action outputs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test "${{ steps.gac-action-impact-clear.outcome }}" = "success"
          test "${{ steps.gac-action-impact-clear.outputs.status }}" = "passed"
          test "${{ steps.gac-action-impact-clear.outputs.impact-status }}" = "clear"
          test "${{ steps.gac-action-impact-clear.outputs.contract-version }}" = ""
          test "${{ steps.gac-action-impact-clear.outputs.result-path }}" = ""
          test "${{ steps.gac-action-impact-clear.outputs.impact-result-version }}" = "1"
          test "${{ steps.gac-action-impact-clear.outputs.writes-performed }}" = "0"
          test -f "${{ steps.gac-action-impact-clear.outputs.impact-result-path }}"
          test -f "${{ steps.gac-action-impact-clear.outputs.report-path }}"
          test ! -f "${{ steps.gac-action-impact-clear.outputs.artifacts-path }}/action-result.json"
          test -f "${{ steps.gac-action-impact-clear.outputs.artifacts-path }}/annotations.txt"
          test ! -s "${{ steps.gac-action-impact-clear.outputs.artifacts-path }}/annotations.txt"
          python -c "import json; p=json.load(open('${{ steps.gac-action-impact-clear.outputs.impact-result-path }}',encoding='utf-8')); assert p['result_schema']=='governance-impact-result'; assert p['result_version']=='1'; assert p['status']=='clear'; assert p['writes_performed']==0"

      - name: Official Action impact IMPACTED smoke
        id: gac-action-impact-impacted
        uses: ./
        with:
          operation: impact
          pr-comment: "false"
          output-directory: .governance-ci-impact-impacted
          impact-namespace: analytics
          impact-changes: tests/fixtures/github_action/impact/changes.json
          impact-dbt-manifest: '["tests/fixtures/github_action/impact/manifest.impacted.json"]'

      - name: Assert impact IMPACTED Action outputs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test "${{ steps.gac-action-impact-impacted.outcome }}" = "success"
          test "${{ steps.gac-action-impact-impacted.outputs.status }}" = "passed"
          test "${{ steps.gac-action-impact-impacted.outputs.impact-status }}" = "impacted"
          test "${{ steps.gac-action-impact-impacted.outputs.contract-version }}" = ""
          test "${{ steps.gac-action-impact-impacted.outputs.result-path }}" = ""
          test "${{ steps.gac-action-impact-impacted.outputs.impact-result-version }}" = "1"
          test "${{ steps.gac-action-impact-impacted.outputs.writes-performed }}" = "0"
          test -f "${{ steps.gac-action-impact-impacted.outputs.impact-result-path }}"
          test -f "${{ steps.gac-action-impact-impacted.outputs.report-path }}"
          grep -q "IMPACT: IMPACTED" "${{ steps.gac-action-impact-impacted.outputs.report-path }}"
          ann="${{ steps.gac-action-impact-impacted.outputs.artifacts-path }}/annotations.txt"
          test -f "${ann}"
          test "$(grep -c '::warning::' "${ann}")" = "1"
          grep -q "governance impact: impacted" "${ann}"
          test "$(grep -c '::error::' "${ann}" || true)" = "0"
          python -c "import json; p=json.load(open('${{ steps.gac-action-impact-impacted.outputs.impact-result-path }}',encoding='utf-8')); assert p['result_schema']=='governance-impact-result'; assert p['status']=='impacted'; assert p['writes_performed']==0"

      - name: Official Action impact ERROR smoke
        id: gac-action-impact-error
        continue-on-error: true
        uses: ./
        with:
          operation: impact
          pr-comment: "false"
          output-directory: .governance-ci-impact-error
          impact-namespace: analytics
          impact-changes: tests/fixtures/github_action/impact/changes.invalid.json
          impact-dbt-manifest: '["tests/fixtures/github_action/impact/manifest.clear.json"]'

      - name: Assert impact ERROR Action finalization
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test "${{ steps.gac-action-impact-error.outcome }}" = "failure"
          test "${{ steps.gac-action-impact-error.outputs.status }}" = "failed"
          test "${{ steps.gac-action-impact-error.outputs.impact-status }}" = "failed"
          test "${{ steps.gac-action-impact-error.outputs.impact-result-version }}" = ""
          test "${{ steps.gac-action-impact-error.outputs.writes-performed }}" = "0"
          test -n "${{ steps.gac-action-impact-error.outputs.report-path }}"
          test -n "${{ steps.gac-action-impact-error.outputs.artifacts-path }}"
          test -f "${{ steps.gac-action-impact-error.outputs.report-path }}"
          test -d "${{ steps.gac-action-impact-error.outputs.artifacts-path }}"
          ann="${{ steps.gac-action-impact-error.outputs.artifacts-path }}/annotations.txt"
          test -f "${ann}"
          test "$(grep -c '::error::' "${ann}")" = "1"
          ! grep -q "changed_nodes" "${ann}"
          ! grep -q "manifest.clear.json" "${ann}"

      - name: Cleanup Action smoke artifacts
        if: ${{ always() }}
        run: rm -rf .governance-ci-action .governance-ci-blocked .governance-ci-impact-clear .governance-ci-impact-impacted .governance-ci-impact-error

      - name: Teardown
        if: always()
        run: docker compose down -v
