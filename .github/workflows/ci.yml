name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Import package
        run: python -c "import governance; print(governance.__version__)"

      - name: Entry point
        run: |
          governance --help
          python -m governance --help

      - name: Pytest
        run: pytest -m "not integration and not collibra_integration and not cli_integration"

  package-validation:
    name: package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Install artifact in clean environment
        run: |
          python -m venv .venv-package
          . .venv-package/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import governance; from importlib import metadata; assert governance.__version__ == '1.0.0'; assert metadata.version('collibra-governance-automation') == '1.0.0'"
          python -c "from governance.scanner import MetadataDiscoveryError, PostgresMetadataScanner"
          python -c "from governance.exporters import INVENTORY_SCHEMA, INVENTORY_VERSION, SCANNER_CONTRACT_VERSION, InventoryExportError, MetadataInventory, write_inventory"
          python -c "from governance.integrations.collibra import CollibraAdapterError, CollibraDesiredState, CollibraRemoteState, LiveCollibraAdapter, MockCollibraAdapter, SyncPlan, SyncResult, build_collibra_adapter, build_sync_plan, execute_sync_plan, load_mapping_config_file, map_to_desired_state, mapping_contains_example_placeholders, mock_mapping_config"
          python -c "from importlib.resources import files; c=files('governance.config_contract.schemas').joinpath('governance-config.v1.schema.json'); p=files('governance.policy.schemas').joinpath('governance-policy.v1.schema.json'); g=files('governance.plans.schemas').joinpath('governance-plan.v1.schema.json'); ct=c.read_text(encoding='utf-8'); pt=p.read_text(encoding='utf-8'); gt=g.read_text(encoding='utf-8'); assert c.is_file() and p.is_file() and g.is_file(); assert 'urn:collibra-governance-automation:schema:governance-config:1' in ct; assert 'urn:collibra-governance-automation:schema:governance-policy:1' in pt; assert 'urn:collibra-governance-automation:schema:governance-plan:1' in gt; assert 'schema_version' in ct; assert 'policy_version' in pt; assert 'plan_version' in gt"
          python -c "from governance.policy import load_normalized_policies, evaluate_policies; from governance.plans import load_saved_plan, SavedGovernancePlan; from governance.integrations.collibra import PLANNER_CONTRACT_VERSION, normalize_base_url"
          governance --help
          test "$(governance --version)" = "governance 1.0.0"
          python -m governance --help
          ls dist/*-1.0.0-*.whl dist/*-1.0.0.tar.gz

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Verify demo dataset contract
        run: bash sample/verify_demo.sh

      - name: Recreate from clean volume
        run: |
          docker compose down -v
          docker compose up -d --wait
          bash sample/verify_demo.sh

      - name: Teardown
        if: always()
        run: docker compose down -v

  metadata-integration:
    name: metadata-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Metadata integration tests
        run: pytest -m integration

      - name: Teardown
        if: always()
        run: docker compose down -v

  collibra-integration:
    name: collibra-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Collibra mock lifecycle
        run: pytest -m collibra_integration

      - name: Teardown
        if: always()
        run: docker compose down -v

  cli-integration:
    name: cli-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Compose file
        run: docker compose config -q

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: CLI integration tests
        run: pytest -m cli_integration

      - name: Teardown
        if: always()
        run: docker compose down -v
