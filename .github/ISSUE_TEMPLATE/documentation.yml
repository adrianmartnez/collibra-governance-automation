name: Documentation issue
description: Report unclear, missing, outdated, or incorrect documentation.
body:
  - type: input
    id: location
    attributes:
      label: Documentation location / URL
      description: Path or URL to the documentation you are referring to.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the current `main` documentation.
          required: true
